[project]
name = "indian-quant-research"
version = "0.1.0"
description = "Autonomous Indian Quant Trading & Research Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core data
    "pandas>=2.0",
    "polars>=0.20",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "duckdb>=0.10",
    # Statistics & ML
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "hmmlearn>=0.3",
    # Technical analysis
    "pandas-ta>=0.3",
    # Data acquisition
    "yfinance>=0.2",
    "requests>=2.31",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # API & Web
    "fastapi>=0.111",
    "uvicorn>=0.25",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # Visualization & notebooks
    "plotly>=5.18",
    "jupyter>=1.0",
    "nbformat>=5.9",
    "matplotlib>=3.8",
    # Scheduling & utilities
    "schedule>=1.2",
    "rich>=13.0",
    "click>=8.1",
    "pydantic>=2.5",
    "tqdm>=4.66",
    # Testing
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
research-agent = "research_agent:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
