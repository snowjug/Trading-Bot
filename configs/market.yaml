# Market-state and candidate-setup thresholds.
market:
  symbols: [NIFTY, BANKNIFTY]
  primary_tf: "5m"
  timeframes: ["5m", "15m", "30m", "1h", "1d"]
  level_lookback: 40                # bars a level must hold to count
  or_bars: 3                        # opening-range bars
  state_window: 400                 # trailing bars handed to the state builder

setups:
  min_bars_primary: 60
  vol_expansion_ratio: 1.40
  break_min_atr_frac: 0.15
  vwap_stretch_atr: 1.50
  compression_max: 0.35
  trend_strength_min: 0.35
  min_minutes_into_session: 15
  min_minutes_to_close: 30
  rsi_overbought: 72.0
  rsi_oversold: 28.0
  expected_move_atr_mult: 1.0

session:
  open: "09:15"
  close: "15:30"
